name: Security Gate Demonstration

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  intentional-failure-demo:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Create temporary intentionally vulnerable fixture
        run: |
          mkdir -p /tmp/security-gate-demo
          cat > /tmp/security-gate-demo/bad.js <<'EOF'
          function demo(req) {
            return eval(req.body.input);
          }
          EOF

      - name: Prove SAST gate blocks a bad build
        run: |
          pipx install semgrep
          semgrep scan --config security/semgrep.yml --error /tmp/security-gate-demo
